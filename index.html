<!DOCTYPE html> <html lang="ja"> <head> <meta charset="UTF-8"> <meta name="viewport" content="width=device-width, initial-scale=1.0"> <title>ポコチャ 必要アイテム数計算</title> <style> * { box-sizing: border-box; } body { margin: 0; padding: 20px; background: #f5f5f5; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Hiragino Kaku Gothic ProN", "Yu Gothic", sans-serif; color: #333; } .container { max-width: 480px; margin: 0 auto; background: #ffffff; padding: 24px; border-radius: 16px; box-shadow: 0 4px 16px rgba(0, 0, 0, 0.08); } h1 { margin: 0 0 24px; text-align: center; font-size: 24px; } .field { margin-bottom: 18px; } label { display: block; margin-bottom: 6px; font-weight: bold; } input { width: 100%; padding: 12px; border: 1px solid #ccc; border-radius: 8px; font-size: 20px; text-align: right; } input:focus { outline: none; border-color: #ff7a00; } .info { margin-top: 6px; font-size: 13px; color: #777; text-align: right; } .results { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 28px; } .result { padding: 20px 10px; border-radius: 12px; text-align: center; } .firework { background: #fff4e8; } .carriage { background: #eef6ff; } .result-label { font-size: 15px; margin-bottom: 8px; } .result-value { font-size: 28px; font-weight: bold; } .firework .result-value { color: #e65c00; } .carriage .result-value { color: #2468a2; } .detail { margin-top: 20px; padding: 14px; background: #f7f7f7; border-radius: 10px; font-size: 14px; line-height: 1.8; } .detail-row { display: flex; justify-content: space-between; gap: 12px; } .detail-value { font-weight: bold; text-align: right; } .note { margin-top: 16px; font-size: 13px; color: #777; line-height: 1.6; } @media (max-width: 420px) { body { padding: 12px; } .container { padding: 18px; } .result-value { font-size: 24px; } } </style> </head> <body> <div class="container"> <h1>🔥 ポコチャ 必要アイテム数計算</h1> <div class="field"> <label for="targetPoint">目標応援ポイント</label> <input id="targetPoint" type="number" inputmode="numeric" min="0" placeholder="例：1000000" > </div> <div class="field"> <label for="currentPoint">現在応援ポイント</label> <input id="currentPoint" type="number" inputmode="numeric" min="0" placeholder="例：750000" > </div> <div class="field"> <label for="coreCount">現在コア数</label> <input id="coreCount" type="number" inputmode="numeric" min="0" placeholder="例：100" > <div class="info"> コアボーナス： <span id="coreBonus">---</span>% </div> </div> <div class="field"> <label for="elbo">エルボ見込み</label> <input id="elbo" type="number" inputmode="numeric" min="0" placeholder="例：500000" > </div> <div class="results"> <div class="result firework"> <div class="result-label"> 必要な花火 </div> <div class="result-value"> 🎆 <span id="fireworks">---</span> </div> </div> <div class="result carriage"> <div class="result-label"> 必要な馬車 </div> <div class="result-value"> 🐴 <span id="carriages">---</span> </div> </div> </div> <div class="detail"> <div class="detail-row"> <span>残り応援ポイント</span> <span class="detail-value" id="remainingPoint">---</span> </div> <div class="detail-row"> <span>花火1つのポイント</span> <span class="detail-value" id="fireworkPoint">---</span> </div> <div class="detail-row"> <span>馬車1つのポイント</span> <span class="detail-value" id="carriagePoint">---</span> </div> </div> <div class="note"> ※ 必要アイテム数は小数点第1位まで表示し、第2位以下を切り上げています。<br> ※ エルボ見込みは10分の1を応援ポイントから差し引いて計算します。 </div> </div> <script>
document.addEventListener("DOMContentLoaded", function () {

    const targetPoint = document.getElementById("targetPoint");
    const currentPoint = document.getElementById("currentPoint");
    const coreCount = document.getElementById("coreCount");
    const elbo = document.getElementById("elbo");

    const fireworksResult = document.getElementById("fireworks");
    const carriagesResult = document.getElementById("carriages");
    const coreBonusResult = document.getElementById("coreBonus");
    const remainingPointResult = document.getElementById("remainingPoint");
    const fireworkPointResult = document.getElementById("fireworkPoint");
    const carriagePointResult = document.getElementById("carriagePoint");


    function getCoreBonus(core) {
        if (core >= 500) return 22;
        if (core >= 400) return 21;
        if (core >= 300) return 20;
        if (core >= 250) return 19;
        if (core >= 200) return 18;
        if (core >= 150) return 17;
        if (core >= 100) return 16;
        if (core >= 90) return 15;
        if (core >= 80) return 14;
        if (core >= 70) return 13;
        if (core >= 60) return 12;
        if (core >= 50) return 11;
        if (core >= 45) return 10;
        if (core >= 40) return 9;
        if (core >= 35) return 8;
        if (core >= 30) return 7;
        if (core >= 25) return 6;
        if (core >= 20) return 5;
        if (core >= 15) return 4;
        if (core >= 10) return 3;
        if (core >= 5) return 2;
        if (core >= 2) return 1;

        return 0;
    }


    // 小数点第2位以下を切り上げ
    function ceilToOneDecimal(value) {
        return Math.ceil(value * 10) / 10;
    }


    function calculate() {

        const target = Number(targetPoint.value) || 0;
        const current = Number(currentPoint.value) || 0;
        const core = Number(coreCount.value) || 0;
        const elboValue = Number(elbo.value) || 0;


        // コアボーナス
        const coreBonus = getCoreBonus(core);

        coreBonusResult.textContent = coreBonus;


        // 残り応援ポイント
        let remaining =
            target
            - current
            - (elboValue / 10);

        remaining = Math.max(0, remaining);


        // ボーナス倍率
        const bonusRate =
            (100 + coreBonus) / 100;


        // 1個あたりのポイント
        const fireworkPoint =
            1080 * bonusRate * 4;

        const carriagePoint =
            5555 * bonusRate * 4;


        // 詳細表示
        remainingPointResult.textContent =
            remaining.toLocaleString();

        fireworkPointResult.textContent =
            fireworkPoint.toLocaleString(
                "ja-JP",
                {
                    maximumFractionDigits: 2
                }
            );

        carriagePointResult.textContent =
            carriagePoint.toLocaleString(
                "ja-JP",
                {
                    maximumFractionDigits: 2
                }
            );


        // 目標未入力
        if (targetPoint.value === "") {
            fireworksResult.textContent = "---";
            carriagesResult.textContent = "---";
            return;
        }


        // 達成済み
        if (remaining <= 0) {
            fireworksResult.textContent = "0.0";
            carriagesResult.textContent = "0.0";
            return;
        }


        // 必要数
        const fireworks =
            ceilToOneDecimal(
                remaining / fireworkPoint
            );

        const carriages =
            ceilToOneDecimal(
                remaining / carriagePoint
            );


        fireworksResult.textContent =
            fireworks.toFixed(1);

        carriagesResult.textContent =
            carriages.toFixed(1);
    }


    // 入力するたび自動計算
    targetPoint.addEventListener("input", calculate);
    currentPoint.addEventListener("input", calculate);
    coreCount.addEventListener("input", calculate);
    elbo.addEventListener("input", calculate);


    // ページを開いた時にも一度計算
    calculate();

});
</script> </body> </html>
